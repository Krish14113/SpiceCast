name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Match app version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: npm version $($env:GITHUB_REF_NAME.TrimStart('v')) --no-git-tag-version
      - run: npm run build
      - name: Create GitHub release and publish updater files
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build installer artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: SpiceCast-Windows
          path: release/*.exe
