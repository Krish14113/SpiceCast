appId: com.spicestar.spicecast
productName: SpiceCast
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/whatsapp-web.js/**
  - node_modules/puppeteer-core/**
publish:
  provider: github
  owner: Krish14113
  repo: SpiceCast
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
